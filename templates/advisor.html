<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbox · Asesor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b141a;color:#e9edef}header{padding:22px 5%;background:#202c33}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#8696a0}.wrap{padding:24px 5%;display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.panel{background:#111b21;border:1px solid #26353d;border-radius:16px;overflow:hidden}.title{padding:16px 18px;border-bottom:1px solid #26353d;font-weight:bold}.lead{padding:15px 18px;border-bottom:1px solid #26353d;cursor:pointer}.lead:hover{background:#202c33}.lead strong{display:block}.meta{font-size:13px;color:#8696a0;margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;margin-top:7px;background:#26353d}.QUALIFIED{background:#075e54}.REJECTED{background:#7d2424}.REVIEW{background:#705b13}.detail{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.field{background:#202c33;padding:12px;border-radius:10px}.field small{display:block;color:#8696a0;margin-bottom:5px}.msg{padding:9px 11px;border-radius:9px;margin:7px 0;max-width:85%;white-space:pre-wrap}.customer{background:#005c4b;margin-left:auto}.bot{background:#202c33}.empty{padding:40px;color:#8696a0;text-align:center}@media(max-width:800px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🚗 Panel del asesor</h1><p>Leads y contexto previo a la atención humana</p></header><div class="wrap"><section class="panel"><div class="title">Consultas</div><div id="leads"></div></section><section class="panel"><div class="title">Detalle del lead</div><div id="detail" class="empty">Seleccioná una consulta para ver sus datos y conversación.</div></section></div><script>let all=[];const val=v=>v===null||v===''?'—':v;async function load(){all=await(await fetch('/api/leads')).json();const el=document.getElementById('leads');if(!all.length){el.innerHTML='<div class="empty">Todavía no hay consultas.</div>';return}el.innerHTML=all.map((l,i)=>`<div class="lead" onclick="show(${i})"><strong>${val(l.name)} · ${val(l.vehicle)}</strong><div class="meta">Score ${l.score}/100 · ${new Date(l.updated_at).toLocaleString()}</div><span class="badge ${l.status}">${l.status}</span></div>`).join('')}async function show(i){const l=all[i],msgs=await(await fetch('/api/leads/'+encodeURIComponent(l.session_id)+'/messages')).json();document.getElementById('detail').className='detail';document.getElementById('detail').innerHTML=`<div class="grid"><div class="field"><small>Cliente</small>${val(l.name)}</div><div class="field"><small>Vehículo</small>${val(l.vehicle)}</div><div class="field"><small>Destino</small>${val(l.buyer_type)}</div><div class="field"><small>Transferencia</small>${val(l.transfer_to)}</div><div class="field"><small>Acepta transferencia</small>${l.accepts_transfer===1?'Sí':l.accepts_transfer===0?'No':'—'}</div><div class="field"><small>Forma de pago</small>${val(l.payment)}</div><div class="field"><small>Score</small>${l.score}/100</div><div class="field"><small>Estado</small><span class="badge ${l.status}">${l.status}</span></div></div><h3>Conversación</h3>${msgs.map(m=>`<div class="msg ${m.sender}">${escapeHtml(m.message)}</div>`).join('')}`};function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();setInterval(load,5000);</script></body></html>
